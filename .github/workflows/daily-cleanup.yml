# Calls the app's cleanup endpoint once a day. This deletes bookings and receipts
# past their one-week retention, and keeps a free Supabase project from pausing.
#
# Setup (GitHub repo → Settings → Secrets and variables → Actions → New repository secret):
#   SITE_URL     the deployed site, e.g. https://st-anthony.example.com (no trailing slash)
#   CRON_SECRET  the same value as the CRON_SECRET environment variable on the server
name: Daily cleanup

on:
  schedule:
    - cron: '0 2 * * *' # 02:00 UTC = 03:00 in Lagos
  workflow_dispatch: # also allows running it by hand from the Actions tab

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Call cleanup endpoint
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "SITE_URL and CRON_SECRET repository secrets must be set." >&2
            exit 1
          fi
          curl --fail-with-body --silent --show-error --max-time 60 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/cron/cleanup"
